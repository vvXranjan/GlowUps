<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlowUps salon demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm front-desk software, plain words, numbers you can trust.
   IDEA: the salon's appointment book: one row per chair, the day running left to right.
   PICTURE: the chair board (reception), slot grid (customer), earnings chart (owner).
   COLOUR and TYPE: deep plum band, Jaipur rose for action, mirror-brass for done; Figtree throughout.
   LAYOUT: plum header with role switch; each view opens straight onto its working tool. */
:root{color-scheme:light dark;
--bg:light-dark(#faf6f7,#140d16);--card:light-dark(#ffffff,#1f1622);--ink:light-dark(#24162a,#f3e9f1);--mute:light-dark(#6f5f73,#b6a5b8);
--line:light-dark(#eadde4,#3a2b3e);--plum:#3b1b40;--plum2:light-dark(#5a2c61,#c9a3cf);--rose:light-dark(#c8336a,#ef6f9c);--roseT:light-dark(#fbe3ec,#3d1a29);
--brass:light-dark(#9a7028,#d8b26a);--brassT:light-dark(#f6ecd8,#33291a);--busy:light-dark(#5a2c61,#7c4a84);--warn:light-dark(#b3261e,#ff8a80);--warnT:light-dark(#fde7e5,#3b1715)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
header{background:var(--plum);color:#f7eaf3;padding:14px max(4vw,16px) 0}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.brand{font-weight:800;font-size:22px;letter-spacing:-.01em}.brand small{font-weight:500;font-size:14px;opacity:.75;margin-left:8px}
.who{font-size:14px;opacity:.85}
nav.roles{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav.roles a{color:#f7eaf3;text-decoration:none;padding:12px 18px;border-radius:12px 12px 0 0;font-weight:600;white-space:nowrap;opacity:.8}
nav.roles a[aria-current=page]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:24px max(4vw,16px) 48px;max-width:1320px;margin:0 auto}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 20px}
.note{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:start}
.grid2b{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:20px}
@media(max-width:900px){.grid2,.grid2b{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;min-height:44px;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.chip small{display:block;font-weight:500;font-size:12px;opacity:.75}
.btn{border:0;border-radius:12px;padding:11px 18px;min-height:44px;font-weight:700;background:var(--rose);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
label{font-size:14px;font-weight:600;display:block}label input,label select{margin-top:4px;font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
/* services menu */
.cat{margin-bottom:18px}.cat h3{color:var(--plum2)}
.svc{display:flex;width:100%;justify-content:space-between;gap:12px;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:10px 12px;min-height:44px}
.svc:hover{background:var(--roseT)}.svc[aria-pressed=true]{border-color:var(--rose);background:var(--roseT)}
.svc span:last-child{white-space:nowrap;color:var(--mute)}.svc b{font-weight:600}
.step{margin-bottom:22px}.step h3{display:flex;gap:8px;align-items:baseline}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--rose);color:var(--rose);background:var(--card);border-radius:10px;min-height:44px;font-weight:700;font-size:14px;white-space:nowrap}
.slot[aria-pressed=true]{background:var(--rose);color:#fff}
.slot:disabled{border-color:var(--line);color:var(--mute);text-decoration:line-through;background:transparent;cursor:not-allowed;font-weight:500}
.slot small{display:block;font-size:11px;font-weight:500}
.period{font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 6px}
.lunch{grid-column:1/-1;border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--mute);background:repeating-linear-gradient(135deg,transparent 0 8px,var(--line) 8px 9px)}
.strip{position:relative;height:34px;border-radius:8px;background:var(--roseT);overflow:hidden;margin-top:6px}
.strip i{position:absolute;top:0;bottom:0;background:var(--busy)}
.strip i.l{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:4px}
.ok{background:var(--brassT);border:1px solid var(--brass);border-radius:14px;padding:14px 16px;margin-top:14px}
/* board */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.board{min-width:900px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr);border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.bname{padding:10px 12px;font-size:14px;line-height:1.25;border-right:1px solid var(--line)}
.bname b{display:block;font-weight:700}.bname span{color:var(--mute);font-size:12px}
.track{position:relative;height:58px;cursor:copy;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%)}
.hours{height:30px;cursor:default;background:none}
.hours span{position:absolute;top:6px;font-size:12px;color:var(--mute);transform:translateX(-50%);white-space:nowrap}
.lb{position:absolute;top:0;bottom:0;left:30%;width:10%;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);pointer-events:none}
.bk{position:absolute;top:6px;bottom:6px;border-radius:8px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:left;background:var(--busy);color:#fff}
.bk.done{background:var(--brassT);color:var(--ink);border:1px solid var(--brass)}
.bk.noshow{background:repeating-linear-gradient(135deg,var(--warnT) 0 6px,transparent 6px 12px);color:var(--warn);border:1px solid var(--warn)}
.bk b{font-weight:700}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--rose);pointer-events:none}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.low{background:var(--warnT);color:var(--warn)}.pill.okp{background:var(--brassT);color:var(--brass)}.pill.soon{background:var(--roseT);color:var(--rose)}
/* owner */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:13px;color:var(--mute);display:block}.kpi b{font-size:clamp(22px,2.4vw,28px);font-variant-numeric:tabular-nums;display:block;line-height:1.2;white-space:nowrap}
.kpi small{font-size:13px;color:var(--mute)}.up{color:var(--brass)}.down{color:var(--warn)}
.fig{position:relative;height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.bar div{height:14px;border-radius:7px;background:var(--roseT);overflow:hidden}.bar div i{display:block;height:100%;background:var(--rose);border-radius:7px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
/* dialog */
.ov{position:fixed;inset:0;background:rgba(20,8,24,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.open{display:flex}
.dlg{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:15px}.kv span{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--plum);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:90vw}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:9em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:8.5em;margin-inline-start:-9em;color:var(--mute)}.stack td:empty{display:none}.bar{grid-template-columns:96px minmax(0,1fr) 70px}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">The Glow Room <small>Vaishali Nagar, Jaipur · powered by GlowUps</small></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="roles" aria-label="Choose view">
    <a href="#customer" id="nav-customer">Customer</a>
    <a href="#reception" id="nav-reception">Reception</a>
    <a href="#owner" id="nav-owner">Owner</a>
  </nav>
</header>
<main id="app"></main>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
/* ---------- fixed salon setup ---------- */
const OPEN=600,CLOSE=1200,L1=780,L2=840,STEP=15;
const STAFF=[
 {id:'amit',name:'Amit Sharma',g:'M',title:'Senior barber',sk:['mhair']},
 {id:'rohit',name:'Rohit Meena',g:'M',title:'Barber',sk:['mhair']},
 {id:'imran',name:'Imran Qureshi',g:'M',title:'Stylist, colour',sk:['mhair','colour']},
 {id:'sandeep',name:'Sandeep Yadav',g:'M',title:'Barber, massage',sk:['mhair','spa']},
 {id:'deepak',name:'Deepak Saini',g:'M',title:'Spa therapist',sk:['spa']},
 {id:'neha',name:'Neha Gupta',g:'F',title:'Senior stylist',sk:['whair','colour']},
 {id:'pooja',name:'Pooja Rathore',g:'F',title:'Beautician',sk:['beauty']},
 {id:'anjali',name:'Anjali Verma',g:'F',title:'Nail artist',sk:['nails']},
 {id:'sunita',name:'Sunita Kumawat',g:'F',title:'Beautician, nails',sk:['beauty','nails']},
 {id:'kavya',name:'Kavya Jain',g:'F',title:'Stylist, keratin',sk:['whair','colour']}];
const SVC=[
 {id:'mcut',cat:'Hair',name:'Haircut (men)',dur:30,price:250,sk:'mhair',w:6,g:'M'},
 {id:'wcut',cat:'Hair',name:'Haircut (women)',dur:45,price:500,sk:'whair',w:4,g:'F'},
 {id:'wash',cat:'Hair',name:'Hair wash and blow-dry',dur:30,price:350,sk:'whair',w:3,g:'F'},
 {id:'hspa',cat:'Hair',name:'Hair spa',dur:60,price:1200,sk:'whair',w:2,g:'F'},
 {id:'colour',cat:'Hair',name:'Global hair colour',dur:90,price:2500,sk:'colour',w:2,g:'F'},
 {id:'keratin',cat:'Hair',name:'Keratin treatment',dur:150,price:5000,sk:'colour',w:1,g:'F'},
 {id:'beard',cat:'Grooming',name:'Beard trim and shape',dur:15,price:150,sk:'mhair',w:4,g:'M'},
 {id:'shave',cat:'Grooming',name:'Clean shave',dur:15,price:120,sk:'mhair',w:1,g:'M'},
 {id:'cleanup',cat:'Skin',name:'Clean-up',dur:45,price:800,sk:'beauty',w:3,g:'F'},
 {id:'facial',cat:'Skin',name:'Fruit facial',dur:60,price:1200,sk:'beauty',w:3,g:'F'},
 {id:'thread',cat:'Skin',name:'Eyebrow threading',dur:15,price:60,sk:'beauty',w:5,g:'F'},
 {id:'wax',cat:'Skin',name:'Full arms waxing',dur:30,price:400,sk:'beauty',w:3,g:'F'},
 {id:'mani',cat:'Hands and feet',name:'Manicure',dur:45,price:600,sk:'nails',w:3,g:'F'},
 {id:'pedi',cat:'Hands and feet',name:'Pedicure',dur:60,price:800,sk:'nails',w:3,g:'F'},
 {id:'gel',cat:'Hands and feet',name:'Gel nail polish',dur:45,price:900,sk:'nails',w:2,g:'F'},
 {id:'headm',cat:'Spa',name:'Head massage',dur:30,price:300,sk:'spa',w:3,g:'M'},
 {id:'bodym',cat:'Spa',name:'Body massage',dur:60,price:1800,sk:'spa',w:2,g:'X'}];
const ALL1=Object.fromEntries(SVC.map(s=>[s.id,1]));
const PRODUCTS=[
 {id:'shampoo',name:'Shampoo',unit:'ml',pack:1000,pk:'1 L bottle',stock:3200,min:2500,use:{mcut:10,wcut:20,wash:25,hspa:30,colour:30,keratin:40}},
 {id:'cond',name:'Conditioner',unit:'ml',pack:1000,pk:'1 L bottle',stock:1400,min:1500,use:{wcut:10,wash:15,hspa:20,colour:20,keratin:20}},
 {id:'colour',name:'Hair colour',unit:'tubes',pack:1,pk:'tube',stock:9,min:8,use:{colour:2}},
 {id:'dev',name:'Developer',unit:'ml',pack:1000,pk:'1 L bottle',stock:1800,min:1000,use:{colour:60}},
 {id:'kerat',name:'Keratin solution',unit:'ml',pack:1000,pk:'1 L bottle',stock:650,min:500,use:{keratin:150}},
 {id:'spacr',name:'Hair spa cream',unit:'g',pack:500,pk:'500 g tub',stock:700,min:500,use:{hspa:50}},
 {id:'fkit',name:'Facial kit',unit:'kits',pack:1,pk:'kit',stock:14,min:10,use:{facial:1}},
 {id:'ckit',name:'Clean-up kit',unit:'kits',pack:1,pk:'kit',stock:9,min:10,use:{cleanup:1}},
 {id:'wax',name:'Wax',unit:'g',pack:800,pk:'800 g tin',stock:900,min:600,use:{wax:60}},
 {id:'gelp',name:'Gel polish',unit:'ml',pack:15,pk:'15 ml bottle',stock:120,min:60,use:{gel:3}},
 {id:'nkit',name:'Mani-pedi disposable kit',unit:'kits',pack:50,pk:'box of 50',stock:30,min:25,use:{mani:1,pedi:1}},
 {id:'glove',name:'Disposable gloves',unit:'pairs',pack:100,pk:'box of 100',stock:140,min:100,use:{colour:1,keratin:1,wax:1,facial:1,cleanup:1,mani:1,pedi:1,gel:1}},
 {id:'oil',name:'Massage oil',unit:'ml',pack:1000,pk:'1 L bottle',stock:900,min:1000,use:{headm:20,bodym:80,hspa:10}},
 {id:'towel',name:'Disposable towels',unit:'pcs',pack:100,pk:'pack of 100',stock:260,min:200,use:ALL1},
 {id:'after',name:'Aftershave',unit:'ml',pack:500,pk:'500 ml bottle',stock:300,min:250,use:{beard:5,shave:8,mcut:2}}];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const fmt=m=>{const h=Math.floor(m/60),mm=m%60,h12=((h+11)%12)+1;return h12+(mm?':'+String(mm).padStart(2,'0'):'')+(h<12?' am':' pm')};
const day0=new Date();day0.setHours(12,0,0,0);
const dkey=o=>{const d=new Date(day0);d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dlabel=(o,long)=>{const d=new Date(day0);d.setDate(d.getDate()+o);if(!long&&o===0)return'Today';if(!long&&o===1)return'Tomorrow';return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
const dow=o=>{const d=new Date(day0);d.setDate(d.getDate()+o);return d.getDay()};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const svcOf=id=>SVC.find(s=>s.id===id),staffOf=id=>STAFF.find(s=>s.id===id);
const canDo=(st,sv)=>st.sk.includes(sv.sk);
const first=n=>n.split(' ')[0];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- sample data (deterministic) ---------- */
const R=rng(20261123);
const MF=['Rahul','Arjun','Vikram','Karan','Rohan','Aditya','Manish','Nikhil','Saurabh','Gaurav','Harsh','Yash','Ankit','Mohit','Varun','Pranav','Kunal','Siddharth','Tarun','Abhishek','Ravi','Naveen','Lokesh','Faizan','Arif'];
const FF=['Priya','Sneha','Ritu','Megha','Shruti','Aditi','Nidhi','Simran','Kriti','Isha','Payal','Divya','Swati','Tanvi','Komal','Heena','Rashmi','Bhavna','Ananya','Muskan','Riya','Sakshi','Juhi','Mehak','Sana'];
const LN=['Sharma','Agarwal','Jain','Gupta','Meena','Choudhary','Rathore','Shekhawat','Saini','Kumawat','Khandelwal','Mathur','Singh','Verma','Joshi','Purohit','Soni','Khan','Bansal','Goyal'];
const pick=a=>a[Math.floor(R()*a.length)];
let customers=[];
const mkPhone=()=>'9'+String(Math.floor(R()*1e9)).padStart(9,'0');
for(let i=0;i<650;i++)customers.push({id:'c'+i,name:pick(MF)+' '+pick(LN),phone:mkPhone(),g:'M'});
for(let i=650;i<1500;i++)customers.push({id:'c'+i,name:pick(FF)+' '+pick(LN),phone:mkPhone(),g:'F'});
const males=customers.filter(c=>c.g==='M'),females=customers.filter(c=>c.g==='F');
const chooseCust=g=>{const pool=g==='M'?males:g==='F'?females:(R()<.5?males:females);return pool[Math.floor(Math.pow(R(),1.25)*pool.length)]};
let bookings=[],codeN=1000;
const NOW=nowMin();
for(let o=-90;o<=7;o++){
  const wk=[0,6].includes(dow(o));
  const p=o<0?(wk?.62:.42):o===0?.45:Math.max(.1,.38-.04*o);
  for(const st of STAFF){
    const opts=SVC.filter(s=>canDo(st,s));const tw=opts.reduce((a,s)=>a+s.w,0);
    let t=OPEN+(R()<.4?15:0);
    while(t<CLOSE){
      if(t>=L1&&t<L2){t=L2;continue}
      let r=R()*tw,sv=opts[0];for(const s of opts){r-=s.w;if(r<=0){sv=s;break}}
      const end=t+sv.dur;
      if(end>CLOSE||(t<L1&&end>L1)){t+=STEP;continue}
      if(R()<p){
        let status='booked';
        if(o<0||(o===0&&end<=NOW))status=R()<.035?'noshow':'done';
        const c=chooseCust(sv.g==='X'?'X':(sv.id==='colour'&&R()<.25?'M':sv.g));
        bookings.push({id:'b'+codeN,code:codeN++,cust:c.id,staff:st.id,svc:sv.id,date:dkey(o),start:t,dur:sv.dur,status,pay:status==='done'?(R()<.62?'UPI':R()<.75?'Cash':'Card'):null,amt:sv.price,src:R()<.55?'WhatsApp':'Reception'});
        t=end;
      }else t+=STEP*(1+Math.floor(R()*2));
    }
  }
}
/* sample stock: about 0.4 to 2.2 weeks of normal use, a few products deliberately low */

/* ---------- availability ---------- */
const active=b=>b.status==='booked'||b.status==='done';
function isFree(stId,date,start,dur,o){
  const end=start+dur;
  if(start<OPEN||end>CLOSE)return false;
  if(start<L2&&end>L1)return false;
  if(o===0&&start<nowMin()+15)return false;
  return!bookings.some(b=>b.staff===stId&&b.date===date&&active(b)&&start<b.start+b.dur&&b.start<end);
}
const freeStaff=(sv,o,start)=>STAFF.filter(st=>canDo(st,sv)&&isFree(st.id,dkey(o),start,sv.dur,o));
function addBooking(custId,stId,svId,o,start,src){
  const sv=svcOf(svId);
  if(!isFree(stId,dkey(o),start,sv.dur,o))return null;
  const b={id:'b'+codeN,code:codeN++,cust:custId,staff:stId,svc:svId,date:dkey(o),start,dur:sv.dur,status:'booked',pay:null,amt:sv.price,src};
  bookings.push(b);saved.added.push(b);persist();return b;
}
function setStatus(b,status,pay){
  const wasDone=b.status==='done';
  b.status=status;b.pay=pay||null;saved.status[b.id]={status,pay:b.pay};
  if(status==='done'&&!wasDone)for(const p of PRODUCTS){const u=p.use[b.svc];if(u){stock[p.id]=Math.max(0,stock[p.id]-u);saved.stock[p.id]=stock[p.id]}}
  persist();
}
function findOrAddCustomer(name,phone){

  if(!c){c={id:'n'+Date.now(),name:name.trim()||'New customer',phone,g:''};customers.push(c);saved.custs.push(c);persist()}

}

function usage(fromO,toO,statusOk){
  const u=Object.fromEntries(PRODUCTS.map(p=>[p.id,0]));const a=dkey(fromO),z=dkey(toO);
  for(const b of bookings){if(b.date<a||b.date>z||!statusOk(b))continue;for(const p of PRODUCTS){const x=p.use[b.svc];if(x)u[p.id]+=x}}
  return u;
}
function forecast(){
  const w=[1,2,3,4].map(k=>usage(-7*k,-7*k+6,b=>b.status==='done'));
  const booked=usage(0,7,b=>b.status==='booked');
  return PRODUCTS.map(p=>{
    const avg=(w[0][p.id]+w[1][p.id]+w[2][p.id]+w[3][p.id])/4;
    const prev=w[2][p.id]+w[3][p.id],recent=w[0][p.id]+w[1][p.id];
    const trend=prev?Math.min(1.2,Math.max(.85,recent/prev)):1;
    const fc=Math.round(avg*trend),s=stock[p.id];
    const need=fc+p.min-s,packs=need>0?Math.ceil(need/p.pack):0;
    const daysLeft=avg?Math.floor(s/(avg/7)):99;
    return{p,avg:Math.round(avg),fc,booked:booked[p.id],s,packs,daysLeft,low:s<p.min};
  });
}
const qty=(n,p)=>Math.round(n).toLocaleString('en-IN')+' '+p.unit;
function renderInventory(){
  const f=forecast().sort((a,b)=>b.packs-a.packs||a.daysLeft-b.daysLeft);
  const toOrder=f.filter(x=>x.packs>0),low=f.filter(x=>x.low).length;
  $('#rbody').innerHTML=`<h1>${toOrder.length} products to order for next week</h1><p class="sub">${low} below minimum level now. Forecast = average use over the last 4 weeks, adjusted for the recent trend. Use is counted from completed services.</p>
  <div class="toolbar"><div class="note">Suggested order keeps you above the minimum level after next week.</div><div class="chips"><button class="btn ghost sm" id="copyo">Copy order list</button></div></div>
  <div class="card scroll"><table class="stack"><thead><tr><th>Product</th><th class="n">In stock</th><th class="n">Min level</th><th class="n">Used per week</th><th class="n">Next week</th><th class="n">Already booked</th><th>Status</th><th>Order</th><th></th></tr></thead><tbody>
  ${f.map(x=>`<tr><td><b>${esc(x.p.name)}</b></td><td class="n">${qty(x.s,x.p)}</td><td class="n">${qty(x.p.min,x.p)}</td><td class="n">${qty(x.avg,x.p)}</td><td class="n">${qty(x.fc,x.p)}</td><td class="n">${qty(x.booked,x.p)}</td>
  <td>${x.low?'<span class="pill low">Below minimum</span>':x.daysLeft<7?`<span class="pill soon">Lasts ${x.daysLeft} day${x.daysLeft===1?'':'s'}</span>`:'<span class="pill okp">OK</span>'}</td>
  <td>${x.packs?`<b>${x.packs} × ${esc(x.p.pk)}</b>`:'<span class="note">Nothing</span>'}</td><td><button class="btn ghost sm" data-recv="${x.p.id}">Receive</button></td></tr>`).join('')}
  </tbody></table></div><p class="note">Stock goes down when reception marks a service done. "Already booked" is what next week's bookings will use for sure; walk-ins add to it. Sample stock levels.</p>`;
  $('#copyo').onclick=async()=>{const t='Order for The Glow Room, '+dlabel(0,true)+'\n'+toOrder.map(x=>`- ${x.p.name}: ${x.packs} × ${x.p.pk}`).join('\n');try{await navigator.clipboard.writeText(t);toast('Order list copied.')}catch(e){openDlg(`<h2>Order list</h2><pre style="white-space:pre-wrap">${esc(t)}</pre><div class="row"><button class="btn ghost" data-close>Close</button></div>`)}};
  $('#rbody').querySelectorAll('[data-recv]').forEach(b=>b.onclick=()=>{const p=PRODUCTS.find(x=>x.id===b.dataset.recv);
    openDlg(`<h2>Receive ${esc(p.name)}</h2><p>In stock: ${qty(stock[p.id],p)}. Sold as ${esc(p.pk)} (${qty(p.pack,p)}).</p><form id="rf" class="form"><label>Packs received<input id="rq" type="number" min="1" value="1" required></label><div style="align-self:end" class="row"><button class="btn" type="submit">Add to stock</button><button class="btn ghost" type="button" data-close>Cancel</button></div></form>`,d=>{
      d.querySelector('#rf').onsubmit=e=>{e.preventDefault();const n=Math.max(1,+d.querySelector('#rq').value||1);stock[p.id]+=n*p.pack;saved.stock[p.id]=stock[p.id];persist();closeDlg();toast(`${p.name}: ${qty(stock[p.id],p)} in stock now.`);renderInventory()}});
  });
}

/* ---------- owner view ---------- */
function renderOwner(){
  const done=bookings.filter(b=>b.status==='done');
  const sum=(a,z)=>{const A=dkey(a),Z=dkey(z);return done.filter(b=>b.date>=A&&b.date<=Z)};
  const rev=l=>l.reduce((a,b)=>a+b.amt,0);
  const today=sum(0,0),wk=sum(-6,0),pwk=sum(-13,-7),m=sum(-27,0),pm=sum(-55,-28);
  const chg=(a,b)=>b?Math.round((a-b)/b*100):0;
  const wkC=chg(rev(wk),rev(pwk)),mC=chg(rev(m),rev(pm));
  const tmr=bookings.filter(b=>b.date===dkey(1)&&b.status==='booked').length;
  const wkAll=bookings.filter(b=>b.date>=dkey(-6)&&b.date<=dkey(0)&&b.status!=='cancelled');
  const ns=wkAll.filter(b=>b.status==='noshow').length;
  const occ=Math.round(wkAll.filter(active).reduce((a,b)=>a+b.dur,0)/(STAFF.length*540*7)*100);
  const firstVisit={};for(const b of done.slice().sort((a,b)=>a.date.localeCompare(b.date)))if(!firstVisit[b.cust])firstVisit[b.cust]=b.date;
  const wkCust=[...new Set(wk.map(b=>b.cust))],newC=wkCust.filter(c=>firstVisit[c]>=dkey(-6)).length;
  const staffRows=STAFF.map(st=>{const l=wk.filter(b=>b.staff===st.id);return{st,n:l.length,r:rev(l),occ:Math.round(wkAll.filter(b=>b.staff===st.id&&active(b)).reduce((a,b)=>a+b.dur,0)/(540*7)*100)}}).sort((a,b)=>b.r-a.r);
  const cats=[...new Set(SVC.map(s=>s.cat))].map(c=>({c,r:rev(m.filter(b=>svcOf(b.svc).cat===c))})).sort((a,b)=>b.r-a.r);const maxC=Math.max(...cats.map(x=>x.r),1);
  const pays=['UPI','Cash','Card'].map(p=>({p,r:rev(m.filter(b=>b.pay===p))}));const tm=rev(m)||1;
  const cs=custStats();const inactive=customers.map(c=>({c,s:cs[c.id]})).filter(x=>x.s&&x.s.n>=2&&daysAgo(x.s.last)>45).sort((a,b)=>b.s.spent-a.s.spent);
  const lowN=forecast().filter(x=>x.low).length;
  $('#app').innerHTML=`<h1>${inr(rev(wk))} earned in the last 7 days, ${wkC>=0?'up':'down'} ${Math.abs(wkC)}% on the week before</h1>
  <p class="sub">${new Date().getHours()<12?'Good morning':new Date().getHours()<17?'Good afternoon':'Good evening'}, Vaibhav. Figures count completed, paid services only.</p>
  <div class="kpis">
   <div class="kpi"><span>Today so far</span><b>${inr(rev(today))}</b><small>${today.length} services done</small></div>
   <div class="kpi"><span>Last 28 days</span><b>${inr(rev(m))}</b><small class="${mC>=0?'up':'down'}">${mC>=0?'+':''}${mC}% vs previous 28</small></div>
   <div class="kpi"><span>Chair time booked, 7 days</span><b>${occ}%</b><small>${STAFF.length} staff, 9 working hours a day</small></div>
   <div class="kpi"><span>Customers, 7 days</span><b>${wkCust.length}</b><small>${newC} new, ${wkCust.length-newC} returning</small></div>
   <div class="kpi"><span>Tomorrow</span><b>${tmr} bookings</b><small>${ns} no-shows in last 7 days</small></div>
  </div>
  <div class="card"><h2>Daily earnings, last 28 days</h2><div class="fig" id="chart"></div></div>
  <div class="grid2b">
   <div class="card scroll"><h2>Staff, last 7 days</h2><table class="stack"><thead><tr><th>Staff</th><th class="n">Customers</th><th class="n">Earnings</th><th class="n">Chair time booked</th></tr></thead><tbody>
   ${staffRows.map(x=>`<tr><td><b>${esc(x.st.name)}</b><br><span class="note">${esc(x.st.title)}</span></td><td class="n">${x.n}</td><td class="n">${inr(x.r)}</td><td class="n">${x.occ}%</td></tr>`).join('')}</tbody></table></div>
   <div><div class="card"><h2>Earnings by service, 28 days</h2>${cats.map(x=>`<div class="bar"><span>${x.c}</span><div><i style="width:${x.r/maxC*100}%"></i></div><span>${inr(x.r)}</span></div>`).join('')}</div>
   <div class="card" style="margin-top:20px"><h2>How customers paid, 28 days</h2>${pays.map(x=>`<div class="bar"><span>${x.p}</span><div><i style="width:${x.r/tm*100}%;background:var(--brass)"></i></div><span>${Math.round(x.r/tm*100)}%</span></div>`).join('')}</div></div>
  </div>
  <div class="grid2b">
   <div class="card scroll"><h2>${inactive.length} regulars have not come back in 45+ days</h2><p class="note" style="margin-top:-6px">Customers with 2 or more visits. Good people for a "we miss you" WhatsApp message.</p>
   <table class="stack"><thead><tr><th>Customer</th><th>Phone</th><th class="n">Visits</th><th class="n">Last visit</th><th class="n">Spent</th></tr></thead><tbody>
   ${inactive.slice(0,8).map(x=>`<tr><td><b>${esc(x.c.name)}</b></td><td>${esc(x.c.phone)}</td><td class="n">${x.s.n}</td><td class="n">${daysAgo(x.s.last)} days ago</td><td class="n">${inr(x.s.spent)}</td></tr>`).join('')}</tbody></table></div>
   <div class="card"><h2>Stock</h2><p>${lowN} products are below their minimum level.</p><a class="btn" href="#reception" id="toinv" style="display:inline-block;text-decoration:none">Open inventory</a></div>
  </div>
  <p class="note">All figures come from the sample bookings generated for this demo.</p>`;
  $('#toinv').onclick=()=>{rv.tab='inventory'};
  const days=[...Array(28)].map((_,i)=>{const o=i-27;return{o,r:rev(done.filter(b=>b.date===dkey(o)))}});
  const s=$('#chart');
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight,pl=W<520?40:58,pb=28,pt=10,mx=Math.max(...days.map(d=>d.r))*1.1||1;
    const bw=(W-pl-8)/days.length,y=v=>pt+(H-pt-pb)*(1-v/mx);const step=mx>60000?20000:mx>30000?10000:5000;let g='';
    for(let v=0;v<=mx;v+=step)g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--mute)">${v?'₹'+v/1000+'k':'0'}</text>`;
    days.forEach((d,i)=>{const x=pl+i*bw+2,wkend=[0,6].includes(dow(d.o));g+=`<rect x="${x}" y="${y(d.r)}" width="${Math.max(2,bw-4)}" height="${H-pb-y(d.r)}" rx="3" fill="${d.o===0?'var(--rose)':wkend?'var(--plum2)':'var(--busy)'}" opacity="${d.o===0?1:.85}"><title>${dlabel(d.o,true)}: ${inr(d.r)}</title></rect>`;
      if(i%(W<520?7:4)===0||d.o===0)g+=`<text x="${x+bw/2-2}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mute)">${d.o===0?'Today':dlabel(d.o,true).replace(/^\w+,? /,'')}</text>`});
    s.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily earnings for the last 28 days">${g}</svg>`};
  const ro=new ResizeObserver(draw);ro.observe(s);
}
route();
}
</script>
